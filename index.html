<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodCanvas AI - Aesthetic Mood Boards Powered by Pollinations.ai</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header { text-align: center; padding: 30px 0; }
  h1 {
    font-size: 3.5rem;
    background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    font-weight: 800;
  }
  .subtitle { color: #a0a0c0; font-size: 1.1rem; }
  .form-card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    margin: 20px 0;
  }
  label { 
    display: flex; 
    justify-content: space-between; 
    margin: 15px 0 8px; 
    color: #f093fb; 
    font-weight: 600; 
  }
  .help-link {
    font-size: 0.8rem;
    font-weight: normal;
    color: #4facfe;
    text-decoration: none;
  }
  input, select {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3);
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #f093fb;
  }
  .styles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 10px;
  }
  .style-chip {
    padding: 10px;
    border-radius: 10px;
    background: rgba(0,0,0,0.3);
    border: 2px solid transparent;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-size: 0.9rem;
  }
  .style-chip:hover { background: rgba(240,147,251,0.2); }
  .style-chip.selected {
    border-color: #f093fb;
    background: rgba(240,147,251,0.3);
  }
  button {
    background: linear-gradient(90deg, #f093fb, #f5576c);
    color: white;
    border: none;
    padding: 16px 30px;
    font-size: 1.1rem;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 20px;
    width: 100%;
    font-weight: 700;
    transition: transform 0.2s;
  }
  button:hover { transform: scale(1.02); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .moodboard {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: repeat(3, 200px);
    gap: 15px;
    margin-top: 30px;
  }
  .moodboard-item {
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    background: rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.3s;
  }
  .moodboard-item:hover { transform: scale(1.03); }
  .moodboard-item:nth-child(1) { grid-row: span 2; }
  .moodboard-item:nth-child(4) { grid-column: span 2; }
  .moodboard-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .moodboard-item .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f093fb;
    text-align: center;
    padding: 10px;
  }
  .loading {
    text-align: center;
    padding: 40px;
    color: #f093fb;
    font-size: 1.2rem;
  }
  .spinner {
    border: 4px solid rgba(255,255,255,0.1);
    border-top: 4px solid #f093fb;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  footer {
    text-align: center;
    padding: 30px;
    color: #a0a0c0;
  }
  footer a { color: #f093fb; text-decoration: none; font-weight: 600; }
  .badge {
    display: inline-block;
    background: rgba(240,147,251,0.2);
    padding: 8px 15px;
    border-radius: 20px;
    margin-top: 10px;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .actions button { margin-top: 0; }
  @media (max-width: 768px) {
    .moodboard {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 180px);
    }
    .moodboard-item:nth-child(1) { grid-row: span 1; grid-column: span 2; }
    .moodboard-item:nth-child(4) { grid-column: span 1; }
    h1 { font-size: 2.5rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎨 MoodCanvas AI</h1>
    <p class="subtitle">Generate stunning aesthetic mood boards in seconds</p>
  </header>

  <div class="form-card">
    <label for="apiKey">
      <span>🔑 API Key</span>
      <a href="https://enter.pollinations.ai/" target="_blank" class="help-link">Get free key</a>
    </label>
    <input type="password" id="apiKey" placeholder="Paste your API Key here">

    <label for="concept">💭 Your Concept or Theme</label>
    <input type="text" id="concept" placeholder="e.g., autumn cabin, cyberpunk city, dark academia" value="autumn cabin">

    <label>🎭 Visual Style</label>
    <div class="styles-grid" id="stylesGrid">
      <div class="style-chip selected" data-style="cinematic">🎬 Cinematic</div>
      <div class="style-chip" data-style="minimalist">⚪ Minimalist</div>
      <div class="style-chip" data-style="vintage">📷 Vintage</div>
      <div class="style-chip" data-style="cyberpunk">🌃 Cyberpunk</div>
      <div class="style-chip" data-style="gothic">📚 Dark Academia</div>
      <div class="style-chip" data-style="cottagecore">🌿 Cottagecore</div>
      <div class="style-chip" data-style="watercolor">🎨 Watercolor</div>
      <div class="style-chip" data-style="anime">✨ Anime</div>
    </div>

    <label for="palette">🎨 Color Palette</label>
    <select id="palette">
      <option value="warm earthy">Warm Earthy</option>
      <option value="cool blue">Cool Blues</option>
      <option value="pastel pink">Soft Pastels</option>
      <option value="monochrome">Monochrome</option>
      <option value="neon vibrant">Neon Vibrant</option>
      <option value="muted">Muted</option>
      <option value="golden hour">Golden Hour</option>
    </select>

    <button id="generateBtn" onclick="generateMoodboard()">✨ Generate Mood Board</button>
  </div>

  <div id="output"></div>
</div>

<footer>
  <p>Built with ❤️ using <a href="https://pollinations.ai" target="_blank">Pollinations.ai</a></p>
  <div class="badge">⚡ Powered by Pollinations.ai</div>
</footer>

<script>
// updated to the new working endpoint
const IMAGE_API = 'https://gen.pollinations.ai/image';

let selectedStyle = 'cinematic';
document.querySelectorAll('.style-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.style-chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
    selectedStyle = chip.dataset.style;
  });
});

const moodBoardAngles = [
  'wide view',
  'close up',
  'detail texture',
  'landscape',
  'still life',
  'artistic',
];

async function generateMoodboard() {
  const btn = document.getElementById('generateBtn');
  const output = document.getElementById('output');
  const apiKey = document.getElementById('apiKey').value.trim();
  const concept = document.getElementById('concept').value.trim();
  const palette = document.getElementById('palette').value;

  if (!apiKey) {
    alert('Please enter your API Key!');
    return;
  }

  if (!concept) {
    alert('Please enter a concept!');
    return;
  }

  btn.disabled = true;
  btn.textContent = '✨ Generating...';

  output.innerHTML = `
    <div class="moodboard" id="moodboard">
      ${moodBoardAngles.map((_, i) => `
        <div class="moodboard-item">
          <div class="placeholder">
            <div style="text-align:center">
              <div class="spinner"></div>
              <div style="margin-top:10px;font-size:0.9rem">Image ${i+1}/6</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="actions">
      <button onclick="downloadAll()">📥 Download All Images</button>
      <button onclick="generateMoodboard()">🔄 Regenerate</button>
    </div>
  `;

  const items = document.querySelectorAll('.moodboard-item');
  window.currentImageUrls = [];

  for (let i = 0; i < moodBoardAngles.length; i++) {
    const angle = moodBoardAngles[i];
    
    const fullPrompt = `${concept} ${angle} ${selectedStyle} ${palette}`;
    const seed = Math.floor(Math.random() * 100000);
    
    // correctly attaching the api key to the url so it doesnt fail
    const url = `${IMAGE_API}/${encodeURIComponent(fullPrompt)}?width=512&height=512&nologo=true&seed=${seed}&key=${apiKey}`;
    
    window.currentImageUrls.push({ url, name: `moodboard-${i+1}.jpg` });
    
    items[i].innerHTML = `<img src="${url}" alt="Mood image ${i+1}" 
      onclick="window.open('${url}', '_blank')" 
      onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>❌ Error loading image. Check your pollen balance or API key.</div>'">`;
    
    await new Promise(r => setTimeout(r, 1500));
  }

  btn.disabled = false;
  btn.textContent = '✨ Generate Mood Board';
}

function downloadAll() {
  if (!window.currentImageUrls || window.currentImageUrls.length === 0) {
    alert('Generate a mood board first!');
    return;
  }
  window.currentImageUrls.forEach(({ url, name }, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, i * 500);
  });
}
</script>
</body>
</html>
